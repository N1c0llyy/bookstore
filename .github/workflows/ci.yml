name: CI

on:
  push:
    branches:
      - main
      - feature/ci-github-actions
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar dependencias
        run: poetry install

      - name: Executar migrations
        run: poetry run python bookstore/manage.py migrate

      - name: Executar testes
        run: poetry run python bookstore/manage.py test api.tests